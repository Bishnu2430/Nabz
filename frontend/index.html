<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nabz explains your lab report in plain language. It does not diagnose." />
    <link rel="icon" href="/seal.svg" type="image/svg+xml" />
    <title>Nabz</title>
    <script>
      // Apply the saved theme and text size before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("nabz.theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
          var z = localStorage.getItem("nabz.textSize");
          if (z === "large") document.documentElement.style.fontSize = "19px";
          if (z === "larger") document.documentElement.style.fontSize = "21px";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
