name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend · lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nabz
          POSTGRES_PASSWORD: nabz
          POSTGRES_DB: nabz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nabz -d nabz"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://nabz:nabz@localhost:5432/nabz
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check   # models and migrations must agree
      - run: uv run pytest -q

  frontend:
    name: Frontend · typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  docs:
    name: Docs · diagrams are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python docs/diagrams/src/build.py && python docs/diagrams/src/report.py
      - name: Fail if the committed SVGs differ from their source
        run: git diff --exit-code -- docs/diagrams
