# Nabz hosted on one server with Docker (docs/14-setup-and-hosting.md):
#   cp .env.production.example .env      # then fill it in
#   docker compose -f compose.prod.yaml up -d --build
# Caddy (web) serves the built app on ports 80 and 443 and gets the HTTPS certificate for SITE_ADDRESS.
# The API, the worker and the database are reachable only inside the Compose network.
# Development uses compose.yaml (Vite, hot reload, Mailpit) instead.
name: nabz-prod

x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "false"   # no test or tooling packages
  image: nabz-backend:prod
  restart: unless-stopped
  env_file:
    - path: .env
      required: true
  environment:
    APP_ENV: production    # the API refuses to start without a strong SECRET_KEY
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nabz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nabz}
    UPLOAD_DIR: /data/uploads
    DATA_DIR: /srv/data
  volumes:
    - ./data:/srv/data       # catalogue, knowledge passages, confidence model, embedding model
    - uploads:/data/uploads  # the reports and records people upload
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nabz}
      POSTGRES_USER: ${POSTGRES_USER:-nabz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    # one process: sign-in rate limits are kept in memory. Client addresses come from Caddy's X-Forwarded-For.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]

  web:
    build: ./frontend
    image: nabz-web:prod
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env (your domain, or :80 for a trial)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
